name: PlanoAlimentar
options:
  bundleIdPrefix: com.manuelmarques
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  PlanoAlimentar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PlanoAlimentar
        excludes:
          - "**/*.md"
    resources:
      - path: PlanoAlimentar/Resources
    info:
      path: PlanoAlimentar/Info.plist
      properties:
        CFBundleDisplayName: Plano Alimentar
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: false
        NSPhotoLibraryUsageDescription: Acesso às imagens do catálogo de produtos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manuelmarques.PlanoAlimentar
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
