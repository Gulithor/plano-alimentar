<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plano Alimentar">
  <meta name="theme-color" content="#16a34a">
  <title>Plano Alimentar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Welcome Screen -->
  <div id="welcome" class="screen">
    <div class="welcome-content">
      <div class="welcome-icon">🥗</div>
      <h1>Plano Alimentar</h1>
      <p>Carrega o teu plano em PDF para começar.</p>
      <button id="btn-load-welcome" class="btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M12 12V4M8 8l4-4 4 4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Carregar PDF
      </button>
      <input type="file" id="file-input" accept=".pdf" hidden>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="screen hidden">

    <!-- Tab Contents -->
    <div id="tab-meals" class="tab-content active"></div>
    <div id="tab-info" class="tab-content"></div>
    <div id="tab-recipes" class="tab-content"></div>
    <div id="tab-catalogue" class="tab-content catalogue-view"></div>

    <!-- Bottom Tab Bar -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="meals">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M5 3v18M9 3c0 4-2 6-2 9h4c0-3-2-5-2-9M19 3v6c0 2-1.5 3-1.5 3V21" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Refeições</span>
      </button>
      <button class="tab-btn" data-tab="info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 8h.01M12 11v5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Informação</span>
      </button>
      <button class="tab-btn" data-tab="recipes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5A8.97 8.97 0 003 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Receitas</span>
      </button>
    </nav>
  </div>

  <!-- Loading Overlay -->
  <div id="loading" class="hidden">
    <div class="loading-card">
      <div class="spinner"></div>
      <p>A carregar plano...</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
